name: Deploy to AWS

# CD uruchamia się automatycznie po zakończeniu CI ("CI & Security Scan") na gałęzi main.
# Dalej idziemy tylko wtedy, gdy CI zakończył się sukcesem po pushu (nie po pull requeście).
on:
  workflow_run:
    workflows: ["CI & Security Scan"]
    types: [completed]
    branches: [main]

# id-token: write jest potrzebne do OIDC (logowanie do AWS bez kluczy)
permissions:
  id-token: write
  contents: read

# Dwa wdrożenia naraz mogłyby się nałożyć na siebie
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    name: Build & push images (ECR)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Logowanie do AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Logowanie do ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build i push obrazów
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          VERSION=${HEAD_SHA::7}
          docker build -t "$REGISTRY/fitbook-backend:$VERSION" backend
          docker build --build-arg VITE_APP_VERSION="$VERSION" -t "$REGISTRY/fitbook-frontend:$VERSION" frontend
          docker push "$REGISTRY/fitbook-backend:$VERSION"
          docker push "$REGISTRY/fitbook-frontend:$VERSION"

  deploy:
    name: Deploy app, web i healthcheck
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Logowanie do AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Odczyt adresów z AWS
        run: |
          VERSION=${HEAD_SHA::7}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          instance() {
            aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$1" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].$2" --output text
          }

          # Baza: adres i ARN sekretu z hasłem
          read -r RDS_ENDPOINT RDS_SECRET_ARN <<< "$(aws rds describe-db-instances \
            --db-instance-identifier fitbook-db \
            --query 'DBInstances[0].[Endpoint.Address,MasterUserSecret.SecretArn]' --output text)"

          {
            echo "VERSION=$VERSION"
            echo "REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            echo "APP_ID=$(instance fitbook-ec2-app InstanceId)"
            echo "APP_IP=$(instance fitbook-ec2-app PrivateIpAddress)"
            echo "WEB_ID=$(instance fitbook-ec2-web InstanceId)"
            echo "WEB_IP=$(instance fitbook-ec2-web PublicIpAddress)"
            echo "RDS_ENDPOINT=$RDS_ENDPOINT"
            echo "RDS_SECRET_ARN=$RDS_SECRET_ARN"
          } >> "$GITHUB_ENV"

      - name: Pomocnik do poleceń SSM
        run: |
          cat > "$RUNNER_TEMP/ssm-run.sh" <<'EOF'
          #!/usr/bin/env bash
          # Użycie: ssm-run.sh <id-instancji> <plik-ze-skryptem>
          # Wysyła skrypt na instancję przez SSM, czeka na wynik i kończy się błędem, jeśli skrypt się nie powiódł.
          set -euo pipefail
          INSTANCE_ID="$1"
          SCRIPT="$2"
          jq -n --rawfile s "$SCRIPT" '{commands: ($s | split("\n"))}' > "$RUNNER_TEMP/ssm-params.json"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --query Command.CommandId --output text)
          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "Status polecenia SSM: $STATUS"
          [ "$STATUS" = "Success" ]
          EOF
          chmod +x "$RUNNER_TEMP/ssm-run.sh"

      - name: Deploy app (backend na ec2-app)
        run: |
          {
            echo "export AWS_REGION=$AWS_REGION REGISTRY=$REGISTRY VERSION=$VERSION"
            echo "export WEB_IP=$WEB_IP RDS_ENDPOINT=$RDS_ENDPOINT RDS_SECRET_ARN='$RDS_SECRET_ARN'"
            cat <<'EOF'
          set -euo pipefail
          export HOME=/root
          IMAGE="$REGISTRY/fitbook-backend:$VERSION"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$IMAGE"

          # Sekrety pobieramy z Secrets Managera na instancji (nie przechodzą przez GitHub)
          export DJANGO_SECRET_KEY=$(aws secretsmanager get-secret-value --region "$AWS_REGION" \
            --secret-id fitbook/django-secret-key --query SecretString --output text)
          export DB_PASSWORD=$(aws secretsmanager get-secret-value --region "$AWS_REGION" \
            --secret-id "$RDS_SECRET_ARN" --query SecretString --output text \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["password"])')

          docker rm -f backend 2>/dev/null || true
          docker run -d --name backend --restart unless-stopped -p 8080:8080 \
            -e DJANGO_SECRET_KEY -e DB_PASSWORD \
            -e DJANGO_DEBUG=False \
            -e DJANGO_ALLOWED_HOSTS="localhost,127.0.0.1,$WEB_IP" \
            -e DB_NAME=fitbook -e DB_USER=fitbook_admin \
            -e DB_HOST="$RDS_ENDPOINT" -e DB_PORT=5432 \
            "$IMAGE"

          # Czekamy, aż backend wstanie (po migracjach)
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/health/; then
              echo
              echo "Backend działa"
              docker image prune -af >/dev/null || true
              exit 0
            fi
            sleep 3
          done
          docker logs backend --tail 50
          exit 1
          EOF
          } > app.sh
          "$RUNNER_TEMP/ssm-run.sh" "$APP_ID" app.sh

      - name: Deploy web (nginx na ec2-web)
        run: |
          {
            echo "export AWS_REGION=$AWS_REGION REGISTRY=$REGISTRY VERSION=$VERSION APP_IP=$APP_IP"
            cat <<'EOF'
          set -euo pipefail
          export HOME=/root
          IMAGE="$REGISTRY/fitbook-frontend:$VERSION"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$IMAGE"

          docker rm -f frontend 2>/dev/null || true
          docker run -d --name frontend --restart unless-stopped -p 80:80 \
            -e BACKEND_URL="http://$APP_IP:8080" \
            "$IMAGE"

          docker image prune -af >/dev/null || true
          docker ps --filter name=frontend
          EOF
          } > web.sh
          "$RUNNER_TEMP/ssm-run.sh" "$WEB_ID" web.sh

      - name: Healthcheck (publiczny adres)
        run: |
          echo "Adres: http://$WEB_IP/  oczekiwana wersja: $VERSION"
          for i in $(seq 1 12); do
            # Wersja jest wbudowana w plik JS aplikacji (widoczna w stopce strony)
            JS=$(curl -fs "http://$WEB_IP/" | grep -o '/assets/[^"]*\.js' | head -n 1 || true)
            if [ -n "$JS" ] \
              && curl -fs "http://$WEB_IP$JS" | grep -q "$VERSION" \
              && curl -fs "http://$WEB_IP/api/classes/" > /dev/null; then
              echo "OK: aplikacja działa, wersja $VERSION"
              exit 0
            fi
            echo "Próba $i/12 nieudana, ponawiam za 10 s"
            sleep 10
          done
          echo "Healthcheck nie powiódł się"
          exit 1